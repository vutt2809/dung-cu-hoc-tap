<VirtualHost *:80>
    ServerName dung-cu-hoc-tap.local
    DocumentRoot /home/vutt/workspace/freelance/dung-cu-hoc-tap/backend/public

    <Directory /home/vutt/workspace/freelance/dung-cu-hoc-tap/backend/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dung-cu-hoc-tap-error.log
    CustomLog ${APACHE_LOG_DIR}/dung-cu-hoc-tap-access.log combined
</VirtualHost>
