version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dung_cu_hoc_tap_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dung_cu_hoc_tap}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    command: --default-authentication-plugin=mysql_native_password

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
